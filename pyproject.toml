# EPCC release build of the lab fork (source = commit 5aeabb3). Packaging differences from the
# previous pyproject.toml (see git history): build backend uv_build -> setuptools, optional-dependency
# groups dropped, local version label.
[project]
name = "stable-worldmodel"
version = "0.0.6+srl"
description = "World Model Research Made Simple (lab fork, EPCC release build)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Lucas Maes"}, {name = "Quentin Le Lidec"}, {name = "Randall Balestriero"}]
urls = {Homepage = "http://github.com/galilai-group/stable-worldmodel"}
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "loguru",
  "tabulate",
  "gymnasium",
  "einops",
  "h5py",
  "hdf5plugin",
  "tqdm",
  "typer",
  "rich",
]

[project.scripts]
swm = "stable_worldmodel.cli:app"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stable_worldmodel*"]
